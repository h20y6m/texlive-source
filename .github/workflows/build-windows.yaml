name: build-windows

on:
  push:
    branches:
      - 'build-windows/*'
    tags:
      - 'build-windows/*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-windows-msvc
            runner: windows-latest
            msvc_arch: x86
          - target: x64-windows-msvc
            runner: windows-latest
            msvc_arch: x64
          - target: arm64-windows-msvc
            runner: windows-11-arm
            msvc_arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Meson and Ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Set up MSVC
        uses: h20y6m/actions-setup-msvc-env@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure (Meson)
        run: |
          meson setup --backend=ninja --buildtype=release Work-${{ matrix.target }} build-windows

      - name: Build
        run: |
          meson compile -C Work-${{ matrix.target }}

      - name: Install (staging)
        run: |
          meson install -C Work-${{ matrix.target }} --destdir ../inst-${{ matrix.target }}

      - name: Create zip
        shell: pwsh
        run: |
          $zipPath = "texlive-bin-${{ matrix.target }}.zip"

          Write-Host "Creating $zipPath ..."

          Compress-Archive `
              -Path "inst-${{ matrix.target }}/bin/*" `
              -DestinationPath $zipPath `
              -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: texlive-bin-${{ matrix.target }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/build-windows/')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: Work-download
          pattern: texlive-bin-*
          skip-decompress: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            Work-download/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
